<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Detalle - HogarLink</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container py-5">
        <a href="/buscar" class="text-decoration-none">← Volver a resultados</a>
        
        <div class="row mt-3">
            <div class="col-md-8">
                <h1 th:text="${inmueble.direccion}" class="display-5 fw-bold text-dark"></h1>
                <p class="lead">Gestionado por <b th:text="${inmueble.propietario.nombre}"></b></p>
                <hr>
                
                <h4>Fechas disponibles:</h4>
                <div class="list-group mb-4">
                    <div th:each="disp : ${inmueble.disponibilidades}" class="list-group-item d-flex justify-content-between align-items-center">
                        <span>
                            📅 Del <b th:text="${disp.fechaInicio}"></b> al <b th:text="${disp.fechaFin}"></b>
                        </span>
                        <span th:if="${disp.directa}" class="badge bg-success rounded-pill">⚡ Reserva Inmediata</span>
                        <span th:unless="${disp.directa}" class="badge bg-warning text-dark rounded-pill">⌛ Requiere Solicitud</span>
                    </div>
                    <div th:if="${#lists.isEmpty(inmueble.disponibilidades)}" class="alert alert-secondary">
                        El propietario no ha publicado fechas aún.
                    </div>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card shadow border-0 position-sticky" style="top: 20px;">
                    <div class="card-header bg-primary text-white">
                        <h5 class="mb-0">Reservar ahora</h5>
                    </div>
                    <div class="card-body">
                        <h3 class="card-title text-center mb-4">
                            <span th:text="${inmueble.precioNoche}"></span>€ <span class="fs-6 text-muted">/ noche</span>
                        </h3>

                        <form action="/realizarReserva" method="post">
                            <input type="hidden" name="idInmueble" th:value="${inmueble.id}">
                            
                            <div class="mb-3">
                                <label class="form-label small fw-bold">FECHA LLEGADA</label>
                                <input type="date" name="fechaInicio" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label small fw-bold">FECHA SALIDA</label>
                                <input type="date" name="fechaFin" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label small fw-bold">MÉTODO DE PAGO</label>
                                <select name="metodoPago" class="form-select">
                                    <option value="TARJETA_CREDITO">💳 Tarjeta de Crédito</option>
                                    <option value="TARJETA_DEBITO">💳 Tarjeta de Débito</option>
                                    <option value="PAYPAL">🅿️ PayPal</option>
                                </select>
                            </div>

                            <button type="submit" class="btn btn-danger w-100 py-2 fw-bold mt-2">Confirmar Reserva</button>
                        </form>
                    </div>
                    <div class="card-footer text-center small text-muted">
                        No se te cobrará hasta confirmar
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
