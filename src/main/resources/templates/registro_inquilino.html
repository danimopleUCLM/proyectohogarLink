<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Registro Inquilino - HogarLink</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { 
            background-color: #f4f6f9; 
        }
        .card-registro { 
            width: 100%; 
            max-width: 600px; 
            border-radius: 15px; 
            box-shadow: 0 10px 20px rgba(0,0,0,0.1); 
            border: none;
        }
        .card-header { 
            background: #0d6efd; 
            color: white; 
            border-radius: 15px 15px 0 0 !important; 
            padding: 20px; 
            text-align: center;
        }
    </style>
</head>
<body class="d-flex flex-column min-vh-100">

    <div class="flex-grow-1 d-flex align-items-center justify-content-center py-5">
        
        <div class="card card-registro">
            <div class="card-header">
                <h3 class="mb-0">🎒 Nuevo Inquilino</h3>
                <small>Regístrate para reservar alojamientos</small>
            </div>
            <div class="card-body p-4">
                
                <div th:if="${error}" class="alert alert-danger" role="alert">
                    <span th:text="${error}"></span>
                </div>

                <form action="/registroInquilino" method="post" th:object="${inquilino}">
                    <h5 class="mb-3 text-muted">Datos de Cuenta</h5>
                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label class="form-label">Usuario (Login) *</label>
                            <input type="text" name="login" class="form-control" placeholder="Ej: inquilino1" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Contraseña *</label>
                            <input type="password" name="pass" class="form-control" placeholder="••••••" required>
                        </div>
                    </div>

                    <h5 class="mb-3 text-muted border-top pt-3">Datos Personales</h5>
                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label class="form-label">Nombre *</label>
                            <input type="text" name="nombre" class="form-control" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Apellidos</label>
                            <input type="text" name="apellidos" class="form-control">
                        </div>
                        
                        <div class="col-md-8">
                            <label class="form-label">Calle / Avenida</label>
                            <input type="text" name="calle" class="form-control" placeholder="Ej: C/ Mayor">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Número/Piso</label>
                            <input type="text" name="numero" class="form-control" placeholder="Ej: 12, 3ºB">
                        </div>
                        <div class="col-md-5">
                            <label class="form-label">Localidad</label>
                            <input type="text" name="localidad" class="form-control" placeholder="Ej: Toledo">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Provincia</label>
                            <input type="text" name="provincia" class="form-control" placeholder="Ej: Toledo">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">C. Postal</label>
                            <input type="text" name="codigoPostal" class="form-control" placeholder="Ej: 45001">
                        </div>
                    </div>

                    <div class="d-grid gap-2 mt-4">
                        <button type="submit" class="btn btn-primary btn-lg">Crear Cuenta</button>
                        <a href="/login" class="btn btn-outline-secondary">Volver al Login</a>
                    </div>
                </form>
            </div>
        </div>
        
    </div>

    <footer class="bg-dark text-white pt-4 pb-2 mt-auto">
        <div class="container text-center">
            <div class="row text-center text-md-start">
                <div class="col-md-3 mx-auto mt-3">
                    <h5 class="text-uppercase mb-4 fw-bold text-primary">🏠 HogarLink</h5>
                    <p>La plataforma líder en alquiler entre particulares.</p>
                </div>
                <div class="col-md-2 mx-auto mt-3">
                    <h6 class="text-uppercase mb-4 fw-bold">Producto</h6>
                    <p><a href="/buscar" class="text-white text-decoration-none">Buscar</a></p>
                </div>
                <div class="col-md-3 mx-auto mt-3">
                    <h6 class="text-uppercase mb-4 fw-bold">Contacto</h6>
                    <p>📍 C/ Talavera, s/n, Toledo</p>
                    <p>✉️ info@hogarlink.es</p>
                </div>
            </div>
            <hr>
            <div class="text-center pb-3">
                <small>Copyright © 2025 - Tu Nombre/Grupo</small>
            </div>
        </div>
    </footer>

</body>
</html>
