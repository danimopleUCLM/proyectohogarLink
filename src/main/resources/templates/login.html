<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Login - HogarLink</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>body { background: #f8f9fa; display: flex; align-items: center; justify-content: center; height: 100vh; }</style>
</head>
<body>
    <div class="card shadow border-0 p-4" style="width: 100%; max-width: 400px;">
        <h3 class="text-center mb-4 text-primary fw-bold">🏠 HogarLink</h3>
        
        <div th:if="${error}" class="alert alert-danger text-center" th:text="${error}"></div>

        <form action="/login" method="post">
            <div class="mb-3">
                <label class="form-label">Usuario</label>
                <input type="text" name="login" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Contraseña</label>
                <input type="password" name="pass" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2">Entrar</button>
        </form>
        <hr>
        <div class="text-center">
            <small class="text-muted d-block mb-2">¿No tienes cuenta?</small>
            <a href="/registroInquilino" class="btn btn-outline-secondary btn-sm w-100 mb-2">Registrarme como Inquilino</a>
            <a href="/registroPropietario" class="btn btn-outline-dark btn-sm w-100">Registrarme como Propietario</a>
        </div>
    </div>
</body>
</html>
