<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Buscador - HogarLink</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/buscar">🏠 HogarLink</a>
            <div class="d-flex text-white align-items-center">
                <span class="me-3">Hola, <b th:text="${session.usuarioLogueado != null ? session.usuarioLogueado.nombre : 'Invitado'}">User</b></span>
                
                <a th:if="${session.usuarioLogueado != null and session.usuarioLogueado.class.simpleName == 'Propietario'}" 
                   href="/propietario/mis-inmuebles" class="btn btn-light btn-sm me-2 fw-bold text-primary">Gestionar Mis Pisos</a>
                   
                <a href="/logout" class="btn btn-outline-light btn-sm">Salir</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="card shadow-sm mb-5">
            <div class="card-body bg-white">
                <h5 class="card-title mb-3">🔍 Encontrar Alojamiento</h5>
                <form action="/buscar" method="get" class="row g-3">
                    <div class="col-md-5">
                        <input type="text" name="destino" class="form-control" placeholder="¿A dónde vas? (Ej: Madrid)">
                    </div>
                    <div class="col-md-3">
                        <input type="number" name="precioMax" class="form-control" placeholder="Precio Máx (€)">
                    </div>
                    <div class="col-md-3">
                        <select name="politica" class="form-select">
                            <option value="">Cualquier política</option>
                            <option value="REEMBOLSABLE">Reembolsable</option>
                            <option value="NO_REEMBOLSABLE">No Reembolsable</option>
                        </select>
                    </div>
                    <div class="col-md-1">
                        <button type="submit" class="btn btn-primary w-100">Ir</button>
                    </div>
                </form>
            </div>
        </div>

        <h3 class="mb-3">Alojamientos Disponibles</h3>
        
        <div class="alert alert-warning" th:if="${#lists.isEmpty(listaInmuebles)}">
            No se encontraron alojamientos con esos criterios.
        </div>

        <div class="row row-cols-1 row-cols-md-3 g-4">
            <div class="col" th:each="inmueble : ${listaInmuebles}">
                <div class="card h-100 shadow-sm border-0">
                    <div style="height: 150px; background-color: #ddd; display: flex; align-items: center; justify-content: center; color: #777;">
                        🏡 Foto Inmueble
                    </div>
                    <div class="card-body">
                        <h5 class="card-title text-primary" th:text="${inmueble.direccion}">Dirección</h5>
                        <p class="card-text text-muted small">
                            Anfitrión: <span th:text="${inmueble.propietario.nombre}">Nombre</span>
                        </p>
                        <div class="d-flex justify-content-between align-items-center">
                            <span class="badge bg-info text-dark" th:text="${inmueble.politicaCancelacion}">Política</span>
                            <h4 class="mb-0"><span th:text="${inmueble.precioNoche}">0</span>€ <small class="text-muted fs-6">/noche</small></h4>
                        </div>
                    </div>
                    <div class="card-footer bg-white border-top-0 pb-3">
                        <a th:href="@{/detalle/{id}(id=${inmueble.id})}" class="btn btn-outline-primary w-100">Ver Detalles y Reservar</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
