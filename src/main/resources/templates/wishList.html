<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Mis Favoritos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="mt-5">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">🏠 HogarLink</a>
            <div class="d-flex align-items-center">
                
                <div th:if="${session.usuarioLogueado == null}">
                    <a href="/login" class="btn btn-outline-light btn-sm me-2">Iniciar Sesión</a>
                    <a href="/registroInquilino" class="btn btn-primary btn-sm">Registrarse</a>
                </div>

                <div th:if="${session.usuarioLogueado != null}">
                    <span class="text-white me-3">Hola, <b th:text="${session.usuarioLogueado.nombre}">User</b></span>

                    <a href="/wishlist/mis-deseos" class="btn btn-outline-light btn-sm me-2">❤️ Wishlist</a>

                    
                    <a th:if="${session.usuarioLogueado.rol == 'Propietario'}" 
                       href="/propietario/mis-inmuebles" 
                       class="btn btn-warning btn-sm me-2">⚙️ Mi Panel</a>

                    <a th:if="${session.usuarioLogueado.rol == 'Inquilino'}" 
                       href="/inquilino/mis-reservas" 
                       class="btn btn-info btn-sm me-2 text-white">📬 Mis Reservas</a>
                    
                    <a href="/logout" class="btn btn-danger btn-sm">Salir</a>
                </div>

            </div>
        </div>
    </nav>
    <div class="row mt-3">
        

        <div class="col-md-3" th:each="w : ${listaDeseos}">
            <div class="card mb-3 shadow-sm">
                <img th:src="'https://picsum.photos/400/300?random=' + ${w.inmueble.id}" 
                     class="card-img-top">

                <div class="card-body">
                    <h5 th:text="${w.inmueble.direccion}"></h5>
                    <p th:text="${w.inmueble.precioNoche} + ' €/noche'"></p>

                    <a th:href="@{/detalle/{id}(id=${w.inmueble.id})}" class="btn btn-primary w-100">Ver</a>
                    <form th:action="@{/wishlist/delete/{id}(id=${w.inmueble.id})}" method="post">
                        <button class="btn btn-danger w-100 mt-2">🗑 Quitar</button>
                    </form>

                </div>
            </div>
        </div>

    </div>
    <footer class="bg-dark text-white pt-5 pb-4 mt-auto">
        <div class="container-fluid text-center text-md-start px-5">
            <div class="row text-center text-md-start">
                <div class="col-md-3 col-lg-3 col-xl-3 mx-auto mt-3">
                    <h5 class="text-uppercase mb-4 fw-bold text-primary">🏠 HogarLink</h5>
                    <p>La plataforma líder en alquiler de viviendas.</p>
                </div>
                <div class="col-md-2 col-lg-2 col-xl-2 mx-auto mt-3">
                    <h5 class="text-uppercase mb-4 fw-bold">Producto</h5>
                    <p><a href="/buscar" class="text-white text-decoration-none">Buscar Casa</a></p>
                </div>
                <div class="col-md-4 col-lg-3 col-xl-3 mx-auto mt-3">
                    <h5 class="text-uppercase mb-4 fw-bold">Contacto</h5>
                    <p>📍 C/ Talavera, s/n, Toledo</p>
                </div>
            </div>
            <hr class="mb-4">
            <div class="row align-items-center">
                <div class="col-md-7 col-lg-8">
                    <p>Copyright © 2025 Todos los derechos reservados.</p>
                </div>
            </div>
        </div>
    </footer>
</body>
</html>
