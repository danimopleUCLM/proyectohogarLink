<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Reserva Confirmada</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="d-flex align-items-center justify-content-center vh-100 bg-light">
    <div class="text-center p-5 bg-white shadow rounded">
        <h1 class="display-1 text-success">✔</h1>
        <h2 class="mb-3">¡Reserva Confirmada!</h2>
        <p class="lead" th:text="${mensaje}"></p>
        <p class="text-muted" th:if="${referencia}">Referencia de pago: <b th:text="${referencia}"></b></p>
        <a href="/buscar" class="btn btn-primary mt-3">Seguir explorando</a>
    </div>
</body>
</html>
