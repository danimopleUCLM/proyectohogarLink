<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Alta Inmueble - HogarLink</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .card-form { max-width: 800px; margin: 0 auto; border: none; border-radius: 12px; }
    </style>
</head>
<body class="d-flex flex-column min-vh-100">

    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container">
            <span class="navbar-brand fw-bold">🏠 HogarLink</span>
            <a href="/propietario/mis-inmuebles" class="btn btn-outline-light btn-sm">Volver al Panel</a>
        </div>
    </nav>

    <div class="container flex-grow-1">
        <div class="card card-form shadow-lg">
            <div class="card-header bg-primary text-white text-center py-3" style="border-radius: 12px 12px 0 0;">
                <h4 class="mb-0">🏡 Publicar Nuevo Alojamiento</h4>
            </div>
            
            <div class="card-body p-4">
                <form th:action="@{/propietario/nuevo-inmueble}" th:object="${inmueble}" method="post" enctype="multipart/form-data">
                    
                    <div class="mb-3">
                        <label class="form-label fw-bold">Dirección Completa</label>
                        <input type="text" th:field="*{direccion}" class="form-control" placeholder="Ej: Calle Gran Vía 25, Madrid" required>
                        <div class="form-text">Esta dirección se mostrará en los resultados de búsqueda.</div>
                    </div>

                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label class="form-label fw-bold">Precio / Noche</label>
                            <div class="input-group">
                                <span class="input-group-text">€</span>
                                <input type="number" th:field="*{precioNoche}" class="form-control" step="0.1" placeholder="0.00" required>
                            </div>
                        </div>

                        <div class="col-md-4 mb-3">
                            <label class="form-label fw-bold">Capacidad (Viajeros)</label>
                            <input type="number" th:field="*{capacidad}" class="form-control" min="1" value="1" required>
                        </div>

                        <div class="col-md-4 mb-3">
                            <label class="form-label fw-bold">Política Cancelación</label>
                            <select th:field="*{politicaCancelacion}" class="form-select" required>
                                <option value="NO_REEMBOLSABLE">No Reembolsable</option>
                                <option value="REEMBOLSABLE">Reembolsable (100%)</option>
                                <option value="REEMBOLSABLE_50_PER">Parcial (50%)</option>
                            </select>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">Foto Principal del Alojamiento</label>
                        <input type="file" name="archivoImagen" class="form-control" accept="image/*">
                    </div>

                    <hr class="my-4">

                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-success btn-lg fw-bold">Guardar y Publicar</button>
                        <a href="/propietario/mis-inmuebles" class="btn btn-outline-secondary">Cancelar</a>
                    </div>

                </form>
            </div>
        </div>
    </div>

    <footer class="text-center py-4 mt-auto text-muted">
        <small>Copyright © 2025 - HogarLink</small>
    </footer>

</body>
</html>
