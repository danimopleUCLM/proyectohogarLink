<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Publicar Nuevo Alojamiento</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow">
                    <div class="card-header bg-primary text-white">
                        <h4 class="mb-0">🏠 Publicar Nuevo Alojamiento</h4>
                    </div>
                    <div class="card-body p-4">
                        
                        <form th:action="@{/propietario/nuevo-inmueble}" th:object="${inmueble}" method="post" enctype="multipart/form-data">
                            
                            <div class="mb-3">
                                <label class="form-label fw-bold">Dirección</label>
                                <input type="text" th:field="*{direccion}" class="form-control" placeholder="Ej: C/ Mayor 1" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-bold">Precio por Noche (€)</label>
                                <input type="number" th:field="*{precioNoche}" class="form-control" step="0.01" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-bold">Foto del Alojamiento</label>
                                <input type="file" name="archivoImagen" class="form-control" accept="image/*">
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-bold">Política de Cancelación</label>
                                <select th:field="*{politicaCancelacion}" class="form-select">
                                    <option value="REEMBOLSABLE">Reembolsable (100%)</option>
                                    <option value="REEMBOLSABLE_50_PER">Parcialmente Reembolsable (50%)</option>
                                    <option value="NO_REEMBOLSABLE">No Reembolsable</option>
                                </select>
                            </div>

                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-success fw-bold">Publicar Inmueble</button>
                                <a href="/propietario/mis-inmuebles" class="btn btn-secondary">Cancelar</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
