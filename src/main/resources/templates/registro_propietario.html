<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Registro Propietario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>body { background: #e9ecef; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }</style>
</head>
<body>
    <div class="card shadow border-0" style="width: 100%; max-width: 600px;">
        <div class="card-header bg-dark text-white text-center py-3">
            <h4 class="mb-0">🏘️ Nuevo Propietario</h4>
        </div>
        <div class="card-body p-4">
            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
            
            <form action="/registroPropietario" method="post" th:object="${propietario}">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">Login *</label>
                        <input type="text" name="login" class="form-control" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Contraseña *</label>
                        <input type="password" name="pass" class="form-control" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Nombre *</label>
                        <input type="text" name="nombre" class="form-control" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Apellidos</label>
                        <input type="text" name="apellidos" class="form-control">
                    </div>
                    <div class="col-12">
                        <label class="form-label">Dirección Fiscal</label>
                        <input type="text" name="direccion" class="form-control">
                    </div>
                </div>
                <button type="submit" class="btn btn-dark w-100 mt-4">Registrarme</button>
                <a href="/login" class="d-block text-center mt-3">Volver al login</a>
            </form>
        </div>
    </div>
</body>
</html>
