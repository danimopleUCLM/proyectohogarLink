<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Mis Reservas - HogarLink</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/inicio">🏠 HogarLink</a>
            <div class="d-flex align-items-center text-white">
                <span class="me-3">Hola, <b th:text="${session.usuarioLogueado.nombre}"></b></span>
                <a href="/buscar" class="btn btn-outline-light btn-sm me-2">Buscar Pisos</a>
                <a href="/logout" class="btn btn-dark btn-sm">Salir</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <h2 class="mb-4">📬 Buzón de Solicitudes</h2>
        
        <div th:if="${#lists.isEmpty(misSolicitudes)}" class="alert alert-info text-center">
            Aún no has realizado ninguna solicitud de reserva. 
            <br><a href="/buscar" class="alert-link">¡Busca tu próximo destino!</a>
        </div>

        <div class="row row-cols-1 g-4">
            <div class="col" th:each="sol : ${misSolicitudes}">
                <div class="card shadow-sm border-0">
                    <div class="card-body d-flex justify-content-between align-items-center">
                        
                        <div>
                            <h5 class="card-title text-primary mb-1" th:text="${sol.reserva.inmueble.direccion}"></h5>
                            <p class="text-muted small mb-0">
                                📅 <span th:text="${sol.reserva.fechaInicio}"></span> al <span th:text="${sol.reserva.fechaFin}"></span>
                            </p>
                            <small>Propietario: <span th:text="${sol.reserva.inmueble.propietario.nombre}"></span></small>
                        </div>

                        <div class="text-end">
                            <div th:if="${sol.estado == 'PENDIENTE'}">
                                <span class="badge bg-warning text-dark fs-6">⌛ Pendiente</span>
                                <p class="small text-muted mt-2">Esperando respuesta...</p>
                            </div>

                            <div th:if="${sol.estado == 'ACEPTADA'}">
                                <span class="badge bg-success fs-6">✔ ¡Confirmada!</span>
                                <p class="small text-success mt-2">¡Prepara las maletas!</p>
                            </div>

                            <div th:if="${sol.estado == 'RECHAZADA'}">
                                <span class="badge bg-danger fs-6">❌ Denegada</span>
                                <p class="small text-danger mt-2 fw-bold">
                                    💰 Reembolso emitido
                                </p>
                            </div>
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
