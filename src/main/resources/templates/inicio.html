<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Bienvenido a HogarLink</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .hero { background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('https://images.unsplash.com/photo-1560448204-e02f11c3d0e2?ixlib=rb-1.2.1&auto=format&fit=crop&w=1920&q=80'); background-size: cover; height: 80vh; display: flex; align-items: center; justify-content: center; color: white; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">🏠 HogarLink</a>
            <div>
                <span th:if="${session.usuarioLogueado}" class="text-white me-3">Hola, <b th:text="${session.usuarioLogueado.nombre}"></b></span>
                <a th:if="${session.usuarioLogueado == null}" href="/login" class="btn btn-outline-light btn-sm">Iniciar Sesión</a>
                <a th:if="${session.usuarioLogueado != null}" href="/logout" class="btn btn-danger btn-sm">Salir</a>
            </div>
        </div>
    </nav>

    <header class="hero text-center">
        <div class="container">
            <h1 class="display-3 fw-bold mb-3">Encuentra tu alojamiento ideal</h1>
            <p class="lead mb-4">De particular a particular. Sin complicaciones.</p>
            
            <div class="bg-white p-4 rounded shadow-lg mx-auto text-dark" style="max-width: 800px;">
                <form action="/buscar" method="get" class="row g-2">
                    <div class="col-md-5">
                        <input type="text" name="destino" class="form-control form-control-lg" placeholder="¿Dónde quieres ir?">
                    </div>
                    <div class="col-md-3">
                        <input type="number" name="precioMax" class="form-control form-control-lg" placeholder="Precio Máx">
                    </div>
                    <div class="col-md-4">
                        <button type="submit" class="btn btn-primary btn-lg w-100">Buscar</button>
                    </div>
                </form>
                <div class="mt-3">
                    <a href="/buscar" class="fw-bold text-decoration-none">Ver todas las propiedades &rarr;</a>
                </div>
            </div>
        </div>
    </header>
</body>
</html>
